# fly.toml app configuration file generated for aiostreams-private on 2026-11-04T21:51:56Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'aiostreams-private'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-1x'
