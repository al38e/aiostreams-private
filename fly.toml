# fly.toml app configuration file generated for aiostreams-private on 2026-11-05T01:25:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aiostreams-private'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
