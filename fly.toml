# fly.toml app configuration file generated for aiostreams-private on 2026-11-05T06:41:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aiostreams-private'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
